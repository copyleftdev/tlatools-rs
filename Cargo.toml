[workspace]
resolver = "3"
members = ["crates/tla-syntax", "crates/tla-eval", "crates/tla-oracle", "crates/tlatools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Let-chains, which the parser leans on throughout.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/copyleftdev/tlatools-rs"
homepage = "https://github.com/copyleftdev/tlatools-rs"
authors = ["copyleftdev"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
# `stats` beside `status`, `states` beside `status`: both are the right word.
similar_names = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
