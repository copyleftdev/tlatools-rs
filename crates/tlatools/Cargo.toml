[package]
name = "tlatools"
description = "Read, format and check TLA+ specifications from the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
# These read fixtures from the repository, which a published tarball has not.
exclude = ["tests/cli.rs"]
keywords = ["tlaplus", "tla", "formal-methods", "verification", "cli"]
categories = ["command-line-utilities", "development-tools", "science"]
readme = "../../README.md"

[[bin]]
name = "tlatools"
path = "src/main.rs"

[dependencies]
tla-oracle = { path = "../tla-oracle", version = "0.1.0" }
tla-syntax = { path = "../tla-syntax", version = "0.1.0" }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tla-syntax = { path = "../tla-syntax", version = "0.1.0" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
