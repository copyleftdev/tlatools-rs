[package]
name = "tla-oracle"
description = "Decide whether an implementation's state graph refines a TLA+ specification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
# These read fixtures from the repository, which a published tarball has not.
exclude = ["tests/jobs.rs"]
keywords = ["tlaplus", "refinement", "formal-methods", "verification", "testing"]
categories = ["development-tools::testing", "development-tools", "science"]
readme = "../../README.md"

[dependencies]
tla-eval = { path = "../tla-eval", version = "0.1.0" }
tla-syntax = { path = "../tla-syntax", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
