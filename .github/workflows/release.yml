name: release

# Cutting a release is `git tag v0.1.0 && git push --tags`. Everything below
# follows from that: binaries for the usual platforms, a GitHub release, and
# the crates, published in dependency order.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for a re-run"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is released that would not have passed on main.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: the tag and the version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag $tagged, Cargo.toml $declared"
          test "$tagged" = "$declared"

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-aarch64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cross linker for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked --target ${{ matrix.target }} -p tlatools

      - name: package
        shell: bash
        run: |
          name="tlatools-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$name"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/tlatools.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/tlatools" "$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            tlatools-*.tar.gz
            tlatools-*.zip

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums
        run: |
          cd artifacts
          sha256sum tlatools-* > SHA256SUMS
          cat SHA256SUMS

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*

  # Publishing is separate and last: a GitHub release can be deleted and a
  # crates.io version cannot. It skips where the token is absent, so a fork
  # cutting a tag does nothing, and it skips crates already at this version, so
  # a re-run finishes a partial publish instead of failing on what landed.
  crates:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: publish, in dependency order
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN set; skipping crates.io." >&2
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          for crate in tla-syntax tla-eval tla-oracle tlatools; do
            if curl -sfo /dev/null \
                 -H 'User-Agent: tlatools-rs release workflow' \
                 "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already published"
              continue
            fi
            cargo publish -p "$crate" --locked --token "$TOKEN"
          done
