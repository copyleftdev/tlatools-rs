name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --all-targets --all-features

      - name: test
        run: cargo test --all-features

      - name: docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Every public TLA+ specification we can find, and exactly how this parser
  # reads each one. A count can stay the same while the answers change; the
  # committed manifests cannot.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/checkout@v5
        with: { repository: tlaplus/Examples, path: corpus/examples }
      - uses: actions/checkout@v5
        with: { repository: tlaplus/CommunityModules, path: corpus/community }
      - uses: actions/checkout@v5
        with: { repository: tlaplus/tlaplus, path: corpus/tlaplus }
      - name: check the golden manifests
        env:
          TLA_EXAMPLES: corpus/examples
          TLA_COMMUNITY: corpus/community
          TLA_TESTS: corpus/tlaplus/tlatools/org.lamport.tlatools/test-model
        run: tools/golden.sh --check

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutation coverage of the diff
        run: cargo mutants --in-diff <(git diff origin/main...HEAD) -j 2
        env:
          CARGO_MUTANTS_JOBS: 2
